# Simple JSON body injection
# Injects into a JSON field sent in POST body
# Usage: sqlmap -u "http://127.0.0.1:9090/?p=test" --proxy=""

name: json-body-simple
description: "Inject into a JSON body field (e.g. username)"

target:
  method: POST
  url: "https://api.example.com/login"
  headers:
    Content-Type: "application/json"
    Authorization: "Bearer {{TOKEN}}"
  body_template: '{"username": "{{INJECT_POINT}}", "password": "hunter2"}'

chain:
  - layer: json
    field: username

template: '{"username": "admin", "password": "hunter2"}'

proxy:
  listen: "127.0.0.1:9090"
  param: p
